# Template only: API key intentionally empty. Do not overwrite a live config.
[[api_providers]]
name = "deepseek"
base_url = "https://api.deepseek.com/v1"
client_type = "openai"
max_retry = 2
timeout = 60
retry_interval = 4
api_key = ""

[[models]]
name = "deepseek-flash"
model_identifier = "deepseek-flash"
api_provider = "deepseek"
model_type = "llm"
visual = false

[models.extra_params.thinking]
type = "disabled"

[model_task_config.web_search]
model_list = []

[model_task_config.replyer]
model_list = ["deepseek-flash"]
max_tokens = 1536
temperature = 0.9
selection_strategy = "random"
hard_timeout = 90.0

